<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Barangay E-Governance System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            color: #1e293b;
            padding: 24px;
        }

        .about-wrap {
            max-width: 760px;
            margin: 24px auto;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 24px rgba(2, 6, 23, 0.08);
        }

        h1 {
            font-size: 24px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 10px;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="about-wrap">
        <h1>About Us</h1>
        <p>
            Barangay Gulod E-Governance System provides digital tools for resident
            records, document requests, complaints, and barangay services.
        </p>
        <p>
            The platform is built to improve service speed, transparency, and
            accessibility for both residents and barangay staff.
        </p>
        <a href="{% url 'login' %}">Back to Login</a>
    </div>
</body>
</html>
