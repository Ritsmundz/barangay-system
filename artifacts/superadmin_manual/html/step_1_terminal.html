<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step 1: Open the project in Terminal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(90, 135, 255, 0.22), transparent 28%),
        linear-gradient(180deg, #eef4ff 0%, #dfe9fb 100%);
      color: #0f1c33;
    }
    .wrap {
      width: 1280px;
      min-height: 780px;
      margin: 0 auto;
      padding: 48px;
      box-sizing: border-box;
    }
    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e7efff;
      color: #234da8;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      margin: 18px 0 8px;
      font-size: 34px;
      line-height: 1.05;
    }
    p {
      margin: 0 0 28px;
      font-size: 18px;
      line-height: 1.5;
      color: #49607f;
      max-width: 920px;
    }
    .terminal {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(16, 31, 62, 0.22);
      border: 1px solid rgba(10, 31, 77, 0.08);
      background: #0e1728;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 18px;
      background: #111f34;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }
    .red { background: #ff5f56; }
    .yellow { background: #ffbd2e; }
    .green { background: #27c93f; }
    .label {
      margin-left: 8px;
      color: #c7d3ea;
      font-size: 14px;
      font-weight: 700;
    }
    .screen {
      padding: 26px 28px 30px;
      font-family: Consolas, "Courier New", monospace;
      color: #e8eefb;
      font-size: 24px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .line.output {
      color: #90f7c2;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Superadmin Setup</div>
    <h1>Step 1: Open the project in Terminal</h1>
    <p>Open Windows Terminal or PowerShell, then move into the barangay system project folder.</p>
    <div class="terminal">
      <div class="bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="label">Windows PowerShell</span>
      </div>
      <div class="screen"><div class="line">PS C:\Users\Ritsmund> cd C:\Users\Ritsmund\Documents\barangay_project</div>
<div class="line output">OUT> PS C:\Users\Ritsmund\Documents\barangay_project></div></div>
    </div>
  </div>
</body>
</html>
