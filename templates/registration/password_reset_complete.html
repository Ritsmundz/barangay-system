<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Updated - Barangay E-Governance System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        :root {
            --text: #17304f;
            --muted: #5c6f89;
            --primary: #2862d3;
            --primary-deep: #183f85;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: 'IBM Plex Sans', sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.42), transparent 28%),
                linear-gradient(135deg, rgba(12, 36, 74, 0.22), rgba(24, 90, 171, 0.08)),
                url("{{ barangay_hall_data_uri }}") center center / cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(620px, 100%);
            padding: 40px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 32px 70px rgba(8, 24, 52, 0.28);
            backdrop-filter: blur(10px);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .logo-box {
            width: 56px;
            height: 56px;
            padding: 8px;
            border-radius: 16px;
            background: rgba(40, 98, 211, 0.08);
            border: 1px solid rgba(40, 98, 211, 0.14);
        }

        .logo-box img { width: 100%; height: 100%; object-fit: contain; }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(40, 98, 211, 0.08);
            color: var(--primary-deep);
            border: 1px solid rgba(40, 98, 211, 0.14);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--primary); }
        h1 { margin-top: 12px; font-size: clamp(2rem, 4vw, 3rem); line-height: 0.95; letter-spacing: -0.05em; }
        p { margin-top: 14px; color: var(--muted); line-height: 1.7; font-size: 14px; }
        a { color: var(--primary-deep); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand-row">
            <div class="logo-box">
                <img src="{{ barangay_logo_data_uri }}" alt="Barangay Gulod logo">
            </div>
            <div class="pill">Barangay Gulod</div>
        </div>
        <div class="eyebrow">Resident Account Recovery</div>
        <h1>Password updated</h1>
        <p>Your resident account password has been changed successfully. You can now sign in with the new password.</p>
        <p><a href="{% url 'login' %}">Go to sign in</a></p>
    </main>
</body>
</html>
